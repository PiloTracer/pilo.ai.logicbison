# Fragment - merge into the project's docker-compose.yml (never wholesale-replace).
# Service names here match CURSORRULES_VALUES.md: SERVICE_API=api, SERVICE_DB=db.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
